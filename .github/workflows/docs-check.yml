name: Documentation checks

on:
  pull_request:
  push:
    branches: [multiversion, "digital-items/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout literal feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/typed-peripheral-digitalitems/requirements-docs.txt
      - name: Install documentation dependencies
        run: timeout --foreground 120s python -m pip install -r projects/typed-peripheral-digitalitems/requirements-docs.txt
      - name: Build package, fixtures and both documentation versions
        run: |
          set -euo pipefail
          mkdir -p build
          timeout --foreground 300s ./gradlew :typescript-tests:compileTestLua --no-daemon >build/typescript-tests.log 2>&1
          NODE="$PWD/.gradle/nodejs/node-v22.14.0-linux-x64/bin/node"
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' >build/report-validator-tests.log 2>&1
          timeout --foreground 60s "$NODE" --test .github/scripts/docs-*.test.mjs projects/typed-peripheral-digitalitems/documentation/generate-docs.test.mjs >build/docs-tests.log 2>&1
          timeout --foreground 60s "$NODE" .github/scripts/docs-site.mjs discover --source-ref HEAD >build/docs-discovery.json
          jq '[.plan[] | select(.kind == "branch")]' build/docs-discovery.json >build/docs-plan.json
          while IFS= read -r DOCS_PATH; do
            timeout --foreground 600s ./gradlew :typed-peripheral-digitalitems:generateDocs --no-daemon \
              -PdocsOutput="$PWD/build/docs-fragments/$DOCS_PATH" -PdocsGitRevision="$(git rev-parse HEAD)" \
              -PdocsHostedBaseUrl="https://siredvin.github.io/DigitalItems/$DOCS_PATH/" >"build/docs-${DOCS_PATH//\//-}.log" 2>&1
          done < <(jq -r '.[].path' build/docs-plan.json)
          timeout --foreground 60s "$NODE" .github/scripts/docs-site.mjs assemble --input build/docs-fragments --output build/docs-site --plan build/docs-plan.json
          timeout --foreground 60s "$NODE" .github/scripts/docs-site.mjs validate --site build/docs-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-preview
          path: |
            build/docs-*
          if-no-files-found: error
